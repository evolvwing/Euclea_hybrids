name: Save dorsal review

on:
  issues:
    types: [opened]

permissions: {}

jobs:
  save:
    if: >-
      github.event.issue.title == 'Save dorsal orange line exclusions' &&
      github.event.issue.user.id == github.event.repository.owner.id &&
      github.event.sender.id == github.event.repository.owner.id
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Save review changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout --detach origin/main
            python scripts/apply_dorsal_review.py
            python scripts/build.py --check
            git add data/larval_color_scores_reviewed.csv docs/data.json docs/larval_color_scores.csv
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "Save dorsal orange line exclusions"
            if git push origin HEAD:refs/heads/main; then
              exit 0
            fi
          done
          exit 1
      - name: Publish revised gallery
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
